TYPO3:
  CMS:
    Form:
      persistenceManager:
        allowedFileMounts:
          10: ~
        allowedExtensionPaths:
          10: EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/
        allowSaveToExtensionPaths: true
        allowDeleteFromExtensionPaths: true
      formManager:
        selectablePrototypesConfiguration:
          100:
            identifier: standard
            label: 'Standard'
            newFormTemplates:
              300:
                templatePath: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/contact.form.yaml'
                label: 'Contact'
          200:
            identifier: event
            label: 'Event'
            newFormTemplates:
              100:
                templatePath: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/event.form.yaml'
                label: 'Event'
      prototypes:
        standard:
          finishersDefinition:
            PrefillTimestamps:
              implementationClassName: 'IndizDigitalGmbh\SteppingStoneSitePackage\Form\Finisher\PrefillTimestampsFinisher'
            EmailToReceiver:
              options:
                templateName: 'Default'
                templateRootPaths:
                  20: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Standard/Finishers/Email/'
            EmailToSender:
              options:
                templateName: 'Default'
                templateRootPaths:
                  20: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Standard/Finishers/Email/'
            SaveToDatabaseWithPid:
              implementationClassName: 'TYPO3\CMS\Form\Domain\Finishers\SaveToDatabaseFinisher'
              formEditor:
                iconIdentifier: form-finisher
                label: 'In Datenbank speichern (mit PID)'
                predefinedDefaults:
                  options:
                    errorMessage: ''
                    table: tx_steppingstonesitepackage_form_submissions
                    mode: insert
          formElementsDefinition:
            Form:
              renderingOptions:
                translation:
                  translationFiles:
                    20: 'EXT:stepping_stone_site_package/Resources/Private/Language/Form/locallang.xlf'
                templateRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Standard/'
                partialRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Partials/Standard/'
                layoutRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Layouts/Standard/'
              formEditor:
                editors:
                  900:
                    selectOptions:
                      1000:
                        value: SaveToDatabaseWithPid
                        label: 'Save to database (with PID)'
                propertyCollections:
                  finishers:
                    1000:
                      identifier: SaveToDatabaseWithPid
                      editors:
                        100:
                          identifier: header
                          templateName: Inspector-CollectionElementHeaderEditor
                          label: 'Database Storage (with PID)'
                        200:
                          identifier: pid
                          templateName: Inspector-Typo3WinBrowserEditor
                          label: 'Destination Page (PID)'
                          buttonLabel: 'Select a page'
                          browsableType: pages
                          iconIdentifier: apps-pagetree-page-default
                          propertyPath: options.databaseColumnMappings.pid.value
                          propertyValidatorsMode: OR
                          propertyValidators:
                            10: Integer
                            20: FormElementIdentifierWithinCurlyBracesExclusive
                        9999:
                          identifier: removeButton
                          templateName: Inspector-RemoveElementEditor
            Text:
              formEditor:
                editors:
                  9000: &useAsRecordLabelEditor
                    identifier: useAsRecordLabel
                    templateName: Inspector-CheckboxEditor
                    label: 'Als Datensatz-Bezeichnung im Backend verwenden'
                    propertyPath: properties.useAsRecordLabel
            Textarea:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            Email:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            Telephone:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            Url:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            Number:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            Date:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            DatePicker:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            Checkbox:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            RadioButton:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            MultiSelect:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            MultiCheckbox:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            CountrySelect:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            Hidden:
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
            GridRow:
              properties:
                elementClassAttribute: 'grid gap-y-5 gap-x-2 grid-cols-6 md:grid-cols-12 md:gap-x-10'
                gridColumnClassAutoConfiguration:
                  viewPorts:
                    xs:
                      classPattern: 'col-span-{@numbersOfColumnsToUse}'
                    sm:
                      classPattern: 'sm:col-span-{@numbersOfColumnsToUse}'
                    md:
                      classPattern: 'md:col-span-{@numbersOfColumnsToUse}'
                    lg:
                      classPattern: 'lg:col-span-{@numbersOfColumnsToUse}'
                    xl:
                      classPattern: 'xl:col-span-{@numbersOfColumnsToUse}'
                    xxl:
                      classPattern: 'xxl:col-span-{@numbersOfColumnsToUse}'
            GridColumn:
              properties:
                gridSize:
                  xs: 12
                  sm: 12
                  md: 6
                  lg: 6
                  xl: 6
            SingleSelect:
              properties:
                elementClassAttribute: 'custom-select'
              formEditor:
                editors:
                  9000: *useAsRecordLabelEditor
        event:
          __inheritances:
            10: 'TYPO3.CMS.Form.prototypes.standard'
          formElementsDefinition:
            Form:
              renderingOptions:
                translation:
                  translationFiles:
                    20: 'EXT:stepping_stone_site_package/Resources/Private/Language/Form/locallang.xlf'
                templateRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Standard/'
                partialRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Partials/Standard/'
                layoutRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Layouts/Standard/'
            GridRow:
              properties:
                elementClassAttribute: 'grid gap-y-5 grid-cols-1'
                gridColumnClassAutoConfiguration:
                  viewPorts:
                    xs:
                      classPattern: 'col-span-{@numbersOfColumnsToUse}'
                    sm:
                      classPattern: 'sm:col-span-{@numbersOfColumnsToUse}'
                    md:
                      classPattern: 'md:col-span-{@numbersOfColumnsToUse}'
                    lg:
                      classPattern: 'lg:col-span-{@numbersOfColumnsToUse}'
                    xl:
                      classPattern: 'xl:col-span-{@numbersOfColumnsToUse}'
                    xxl:
                      classPattern: 'xxl:col-span-{@numbersOfColumnsToUse}'
            GridColumn:
              properties:
                gridSize:
                  xs: 6
                  sm: 6
                  md: 12
                  lg: 12
                  xl: 12
                  xxl: 12
            SingleSelect:
              properties:
                elementClassAttribute: 'custom-select'
          finishersDefinition:
            Ics:
              implementationClassName: 'IndizDigitalGmbh\SteppingStoneSitePackage\Form\Finisher\IcsFinisher'
            EmailToReceiver:
              implementationClassName: 'IndizDigitalGmbh\SteppingStoneSitePackage\Form\Finisher\EventEmailFinisher'
              options:
                templateName: 'Default'
                templateRootPaths:
                  20: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Event/Finishers/Email/'
            EmailToSender:
              implementationClassName: 'IndizDigitalGmbh\SteppingStoneSitePackage\Form\Finisher\EventEmailFinisher'
              options:
                templateName: 'Default'
                templateRootPaths:
                  20: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Event/Finishers/Email/'