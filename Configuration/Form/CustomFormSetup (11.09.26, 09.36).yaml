TYPO3:
  CMS:
    Form:
      persistenceManager:
        allowedFileMounts:
          10: ~
        allowedExtensionPaths:
          10: EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/
        allowSaveToExtensionPaths: true
        allowDeleteFromExtensionPaths: true
      formManager:
        selectablePrototypesConfiguration:
          100:
            identifier: standard
            label: 'Standard'
            newFormTemplates:
              100:
                templatePath: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/contact.form.yaml'
                label: 'Contact'
          200:
            identifier: event
            label: 'Event'
            newFormTemplates:
              100:
                templatePath: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/event.form.yaml'
                label: 'Event'
      prototypes:
        standard:
          finishersDefinition:
            PrefillTimestamps:
              implementationClassName: 'IndizDigitalGmbh\SteppingStoneSitePackage\Form\Finisher\PrefillTimestampsFinisher'
            EmailToReceiver:
              options:
                templateName: 'Default'
                templateRootPaths:
                  20: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Standard/Finishers/Email/'
            EmailToSender:
              options:
                templateName: 'Default'
                templateRootPaths:
                  20: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Standard/Finishers/Email/'
          formElementsDefinition:
            Form:
              renderingOptions:
                translation:
                  translationFiles:
                    20: 'EXT:stepping_stone_site_package/Resources/Private/Language/Form/locallang.xlf'
                templateRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Standard/'
                partialRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Partials/Standard/'
                layoutRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Layouts/Standard/'
            GridRow:
              properties:
                elementClassAttribute: 'grid gap-y-5 gap-x-2 grid-cols-6 md:grid-cols-12 md:gap-x-10'
                gridColumnClassAutoConfiguration:
                  viewPorts:
                    xs:
                      classPattern: 'col-span-{@numbersOfColumnsToUse}'
                    sm:
                      classPattern: 'sm:col-span-{@numbersOfColumnsToUse}'
                    md:
                      classPattern: 'md:col-span-{@numbersOfColumnsToUse}'
                    lg:
                      classPattern: 'lg:col-span-{@numbersOfColumnsToUse}'
                    xl:
                      classPattern: 'xl:col-span-{@numbersOfColumnsToUse}'
                    xxl:
                      classPattern: 'xxl:col-span-{@numbersOfColumnsToUse}'
            GridColumn:
              properties:
                gridSize:
                  xs: 12
                  sm: 12
                  md: 6
                  lg: 6
                  xl: 6
            SingleSelect:
              properties:
                elementClassAttribute: 'custom-select'
        event:
          __inheritances:
            10: 'TYPO3.CMS.Form.prototypes.standard'
          formElementsDefinition:
            Form:
              renderingOptions:
                translation:
                  translationFiles:
                    20: 'EXT:stepping_stone_site_package/Resources/Private/Language/Form/locallang.xlf'
                templateRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Standard/'
                partialRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Partials/Standard/'
                layoutRootPaths:
                  100: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Layouts/Standard/'
            GridRow:
              properties:
                elementClassAttribute: 'grid gap-y-5 grid-cols-1'
                gridColumnClassAutoConfiguration:
                  viewPorts:
                    xs:
                      classPattern: 'col-span-{@numbersOfColumnsToUse}'
                    sm:
                      classPattern: 'sm:col-span-{@numbersOfColumnsToUse}'
                    md:
                      classPattern: 'md:col-span-{@numbersOfColumnsToUse}'
                    lg:
                      classPattern: 'lg:col-span-{@numbersOfColumnsToUse}'
                    xl:
                      classPattern: 'xl:col-span-{@numbersOfColumnsToUse}'
                    xxl:
                      classPattern: 'xxl:col-span-{@numbersOfColumnsToUse}'
            GridColumn:
              properties:
                gridSize:
                  xs: 6
                  sm: 6
                  md: 12
                  lg: 12
                  xl: 12
                  xxl: 12
            SingleSelect:
              properties:
                elementClassAttribute: 'custom-select'
          finishersDefinition:
            Ics:
              implementationClassName: 'IndizDigitalGmbh\SteppingStoneSitePackage\Form\Finisher\IcsFinisher'
            EventEmailToReceiver:
              implementationClassName: 'IndizDigitalGmbh\SteppingStoneSitePackage\Form\Finisher\EventEmailFinisher'
              options:
                templateName: 'Default'
                templateRootPaths:
                  20: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Event/Finishers/Email/'
            EventEmailToSender:
              implementationClassName: 'IndizDigitalGmbh\SteppingStoneSitePackage\Form\Finisher\EventEmailFinisher'
              options:
                templateName: 'Default'
                templateRootPaths:
                  20: 'EXT:stepping_stone_site_package/Resources/Private/Extensions/Forms/Templates/Event/Finishers/Email/'