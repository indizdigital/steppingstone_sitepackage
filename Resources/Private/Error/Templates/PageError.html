<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page not found</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }
        .error-page h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem;
        }
        .error-page p {
            font-size: 1.1rem;
            color: #555;
            margin: 0 0 1.5rem;
        }
        .error-page a {
            color: #0b6bcb;
            text-decoration: none;
            font-weight: 600;
        }
        .error-page a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1><f:if condition="{status}">{status}</f:if> Page not found</h1>
        <p><f:if condition="{reason}">{reason}</f:if></p>
        <p><a href="/">Back to homepage</a></p>
    </div>
</body>
</html>
